<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Ledger & Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8 font-sans">

    <div class="max-w-3xl mx-auto">
        <header class="bg-white p-6 rounded-lg shadow-md mb-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">Monthly Ledger</h1>
            <span id="db-status" class="bg-yellow-100 text-yellow-800 text-sm font-semibold px-3 py-1 rounded">Connecting Database...</span>
        </header>

        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-xl font-semibold mb-4">Add New Transaction</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700">Type</label>
                    <select id="type" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                        <option value="asset">Asset Purchase</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Holding / Account</label>
                    <select id="holding" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                        <option value="digital">Digital (Bank/UPI)</option>
                        <option value="physical">Physical (Cash/Gold)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Amount (₹)</label>
                    <input type="number" id="amount" placeholder="0.00" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Description</label>
                    <input type="text" id="description" placeholder="e.g. Groceries or Salary" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                </div>

            </div>
            <button id="add-btn" class="mt-4 w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition">
                Add to Ledger
            </button>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Recent Transactions</h2>
            <div id="transaction-list" class="space-y-3">
                <p class="text-gray-500 text-sm italic">Loading transactions...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // Your specific web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAo-RApK6Qx1chxhE_akU4mOyS8BEy5mgg",
            authDomain: "monthlyledger-6f1b5.firebaseapp.com",
            projectId: "monthlyledger-6f1b5",
            storageBucket: "monthlyledger-6f1b5.firebasestorage.app",
            messagingSenderId: "263782043775",
            appId: "1:263782043775:web:472e077f162822cb2f6f4a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const statusBadge = document.getElementById('db-status');
        statusBadge.textContent = "Database Connected";
        statusBadge.className = "bg-green-100 text-green-800 text-sm font-semibold px-3 py-1 rounded";

        // --- Function to load and display data ---
        async function loadTransactions() {
            const listContainer = document.getElementById('transaction-list');
            
            try {
                // Fetch documents ordered by newest first
                const q = query(collection(db, "transactions"), orderBy("date", "desc"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    listContainer.innerHTML = '<p class="text-gray-500 text-sm italic">No transactions yet. Add one above!</p>';
                    return;
                }

                listContainer.innerHTML = ''; // Clear the loading text
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    // Set colors based on transaction type
                    let amountColor = 'text-blue-600';
                    let sign = '';
                    if (data.type === 'income') { amountColor = 'text-green-600'; sign = '+'; }
                    if (data.type === 'expense') { amountColor = 'text-red-600'; sign = '-'; }

                    // Handle date formatting (fallback if server hasn't timestamped yet)
                    const dateString = data.date ? data.date.toDate().toLocaleDateString() : 'Just now';

                    // Create the HTML for each item
                    const item = document.createElement('div');
                    item.className = 'flex justify-between items-center border-b pb-2 last:border-0 last:pb-0';
                    item.innerHTML = `
                        <div>
                            <p class="font-semibold text-gray-800">${data.description} <span class="text-xs text-gray-500 ml-2">(${data.holdingType})</span></p>
                            <p class="text-xs text-gray-500">${dateString}</p>
                        </div>
                        <div class="font-bold ${amountColor}">
                            ${sign}₹${data.amount}
                        </div>
                    `;
                    listContainer.appendChild(item);
                });
            } catch (error) {
                console.error("Error loading documents: ", error);
                listContainer.innerHTML = '<p class="text-red-500 text-sm italic">Error loading data. Check console (You might need to create an index in Firebase).</p>';
            }
        }

        // Call the load function immediately when the page opens
        loadTransactions();

        // --- Add button logic ---
        document.getElementById('add-btn').addEventListener('click', async () => {
            const type = document.getElementById('type').value;
            const holding = document.getElementById('holding').value;
            const amount = document.getElementById('amount').value;
            const description = document.getElementById('description').value;

            if (!amount || !description) {
                alert("Please enter both an amount and a description.");
                return;
            }

            // Change button text while saving
            const btn = document.getElementById('add-btn');
            btn.textContent = "Adding...";
            btn.disabled = true;

            try {
                await addDoc(collection(db, "transactions"), {
                    type: type,
                    holdingType: holding,
                    amount: Number(amount),
                    description: description,
                    date: serverTimestamp() 
                });
                
                document.getElementById('amount').value = '';
                document.getElementById('description').value = '';
                
                // Reload the list automatically after adding
                await loadTransactions();

            } catch (error) {
                console.error("Error adding document: ", error);
                alert("Failed to add transaction.");
            } finally {
                btn.textContent = "Add to Ledger";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
